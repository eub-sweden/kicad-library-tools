image: python:3.14-slim

default:
  before_script:
    - cd ./library_utils
    - apt-get update -q -y
    - apt-get install -y make
    - python3 -V
    - pip install -r requirements.txt
    - pip install pytest
    - pip install pyyaml

symbol_rulechecker:
  stage: Test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - changes:
      - "library_utils/common/*"
      - "library_utils/klc-check/*"
      - "library_utils/klc-check/*symbol/*"
  script:
    - make test-klc-symbols
    - make test-comparelibs-symbols
  artifacts:
    reports:
      metrics: metrics.txt

footprint_rulechecker:
  stage: Test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - changes:
      - "library_utils/common/*"
      - "library_utils/klc-check/*"
      - "library_utils/klc-check/*footprint.pretty/*"
  script:
    - make test-klc-footprints
  artifacts:
    reports:
      metrics: metrics.txt

check_libutils_code:
  stage: Static Analysis
  rules:
    - changes:
      - "library_utils/**/*"
  script:
    - pip install flake8
    - make lint

check_libutils_spelling:
  stage: Static Analysis
  rules:
    - changes:
      - "library_utils/**/*"
  script:
    - apt-get -qq update && apt-get install --yes codespell
    - make spelling
